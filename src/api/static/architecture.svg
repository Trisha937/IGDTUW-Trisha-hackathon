    <text x="16" y="56" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" font-weight="600" fill="#0F172A">&bull; Economic Times Stock RSS (News)</text>
    <text x="16" y="78" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" font-weight="600" fill="#0F172A">&bull; NSE Corporate Filings (Announcements)</text>
    <text x="16" y="100" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" font-weight="600" fill="#0F172A">&bull; Apify Reddit Stream (Social Sentiment)</text>
