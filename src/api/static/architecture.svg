  <text x="24" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">S&amp;P GLOBAL &amp; CRISIL CAMPUS HACKATHON 2026 &bull; MODULE A SYSTEM ARCHITECTURE</text>
  <text x="896" y="26" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#34D399" text-anchor="end">REAL-TIME DATA FLOW</text>

