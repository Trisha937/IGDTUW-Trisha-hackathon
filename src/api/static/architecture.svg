    <text x="16" y="78" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" font-weight="600" fill="#0F172A">&bull; 384-Dim Vector Embeddings</text>
    <text x="16" y="100" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" font-weight="600" fill="#0F172A">&bull; Cosine Similarity Search</text>
    <text x="16" y="122" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#64748B">&bull; Decay: exp(-ln(2) &times; t / half_life)</text>
