  <g transform="translate(640, 115)">
    <rect width="250" height="250" rx="8" fill="#FFFFFF" stroke="#082119" stroke-width="2" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.06))"/>
    <rect width="250" height="32" rx="8" fill="#082119"/>
    <text x="14" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.5" font-weight="800" fill="#FFFFFF">5. FINANCIAL WORKBENCH</text>
    
