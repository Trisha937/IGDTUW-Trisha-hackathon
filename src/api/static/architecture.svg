    <rect width="250" height="175" rx="8" fill="#FFFFFF" stroke="#047857" stroke-width="2.5" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.06))"/>
    <rect width="250" height="32" rx="8" fill="#D1FAE5"/>
    <rect y="24" width="250" height="8" fill="#D1FAE5"/>
