    <text x="16" y="122" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#64748B">&bull; Cycle Delta Cap: &plusmn;2.0% per stock</text>
    <text x="16" y="142" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#64748B">&bull; Turnover Limit: 10% one-way max</text>
    <text x="16" y="162" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#047857">&bull; Water-Filling Simplex Projection</text>
  </g>

  <!-- Connector 3 -> 4 -->
  <path d="M 460 240 L 460 264" fill="none" stroke="#047857" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Connectors to Delivery Layer -->
  <path d="M 585 152 L 635 152" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 585 358 L 635 358" fill="none" stroke="#047857" stroke-width="2" marker-end="url(#arrow)"/>

