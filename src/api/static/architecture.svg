    <line x1="12" y1="146" x2="238" y2="146" stroke="#E2E8F0" stroke-width="1"/>
    
    <text x="16" y="168" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" font-weight="700" fill="#0F172A">Interactive Dashboard UI</text>
    <text x="16" y="188" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#475569">&bull; Real-Time Allocation Progress Bars</text>
    <text x="16" y="206" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#475569">&bull; Live News Signal Stream with Evidence</text>
    <text x="16" y="224" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#475569">&bull; 1-Click Curated Market Scenarios</text>
    <text x="16" y="242" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#047857" font-weight="700">&bull; Single Command: python main.py</text>
